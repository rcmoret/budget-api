default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# Local dev/test connect to the Postgres defined in compose.yaml, which binds
# host port 5433 (see .env.example). Override via DATABASE_* env vars.
local: &local
  <<: *default
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5433) %>
  username: <%= ENV.fetch("DATABASE_USER", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>

development:
  <<: *local
  database: <%= ENV.fetch("DATABASE_NAME", "budget_app_inertia") %>

test:
  <<: *local
  database: <%= ENV.fetch("TEST_DATABASE_NAME", "api_test") %>

production:
  <<: *default
  database: api_production
  username: api
  password: <%= ENV["API_DATABASE_PASSWORD"] %>
